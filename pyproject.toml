[project]
name = "periodic-table-tui"
version = "0.1.0"
description = "A terminal UI for browsing the periodic table of the elements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.89.0",
]

[project.scripts]
periodic-table-tui = "periodic_table_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/periodic_table_tui"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "textual-dev>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/periodic_table_tui/data.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["periodic_table_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.pypi-dependencies]
periodic-table-tui = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11"

[tool.pixi.feature.dev.pypi-dependencies]
ruff = "*"
textual-dev = "*"
pytest = "*"
pytest-asyncio = "*"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
run = "python -m periodic_table_tui"
lint = "ruff check ."
format = "ruff format ."
test = "python -m pytest"
